  <style>
    :root {
      --yellow:    #F5C400;
      --black:     #0a0a0a;
      --dark:      #111111;
      --gray-dark: #1a1a1a;
      --white:     #ffffff;
      --green:     #22c55e;
      --radius:    14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    /* ── CHECK BADGE ── */
    .check-badge {
      width: 86px; height: 86px;
      border-radius: 50%;
      background: rgba(34,197,94,0.12);
      border: 2px solid var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto 28px;
      animation: pop 0.55s cubic-bezier(0.175,0.885,0.32,1.275) both;
    }
    @keyframes pop {
      0%   { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1);   opacity: 1; }
    }

    /* ── EYEBROW ── */
    .eyebrow {
      display: inline-block;
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.35);
      color: #bdf5d3;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 16px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    /* ── HEADLINE ── */
    h1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: clamp(30px, 7vw, 48px);
      line-height: 1.15;
      margin-bottom: 14px;
    }
    h1 .yellow { color: var(--yellow); }

    .sub {
      font-size: 16px;
      color: #999;
      line-height: 1.7;
      max-width: 440px;
      margin: 0 auto 44px;
    }

    /* ── BUTTONS ── */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 420px;
      margin: 0 auto 40px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 18px 28px;
      border-radius: var(--radius);
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 16px;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover { transform: translateY(-2px); }

    .btn-course {
      background: var(--yellow);
      color: var(--black);
      box-shadow: 0 4px 24px rgba(245,196,0,0.35);
    }
    .btn-course:hover { box-shadow: 0 6px 36px rgba(245,196,0,0.55); }

    .btn-whatsapp {
      background: #25D366;
      color: var(--white);
      box-shadow: 0 4px 24px rgba(37,211,102,0.25);
    }
    .btn-whatsapp:hover { box-shadow: 0 6px 36px rgba(37,211,102,0.4); }

    /* ── GUARANTEE ── */
    .guarantee {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34,197,94,0.08);
      border: 1px solid rgba(34,197,94,0.2);
      color: #aaa;
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 999px;
    }
    .guarantee strong { color: var(--green); }

    @media (max-width: 400px) {
      .btn { font-size: 14px; padding: 16px 20px; }
    }
